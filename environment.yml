# Deep Learning Portfolio — reproducible env for Windows + Anaconda
# CPU-only PyTorch (no NVIDIA / no CUDA). Intel Arc users: this is intentional.
name: dl-portfolio
channels:
  - pytorch
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pytorch::pytorch
  - pytorch::torchvision
  - pytorch::torchaudio
  - pytorch::cpuonly
  - numpy
  - pandas
  - matplotlib
  - pillow
  - scikit-learn
  - pytest
  - jupyter
  - pip
  - pip:
      - ruff
